[package]
name = "horizon-xr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "OpenXR and Vulkan interop for Horizon's native client"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"] }
glam = "0.30"
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan"] }

[lints]
workspace = true
